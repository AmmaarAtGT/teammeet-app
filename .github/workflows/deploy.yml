name: CI/CD Pipeline - Test & Deploy to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'teammeet-app' }}
  APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}

jobs:
  # ===============================================================
  # JOB 1: Automated Quality & Regression Tests
  # ===============================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Lint Verification
        run: |
          node -c server.js
          node -c driveSync.js
          node -c attendance.js
          node -c summarize.js
          node -c public/app.js

      - name: Execute Automated Test Suite (18 Tests)
        run: npm test

  # ===============================================================
  # JOB 2: Build Docker Image, Push to ECR & Deploy to AWS
  # ===============================================================
  deploy-aws:
    name: Build & Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ env.APP_RUNNER_SERVICE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ env.APP_RUNNER_SERVICE_ARN != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image to ECR
        if: ${{ env.APP_RUNNER_SERVICE_ARN != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building production Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Pushing images to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Trigger AWS App Runner Deployment
        if: ${{ env.APP_RUNNER_SERVICE_ARN != '' }}
        run: |
          echo "Starting zero-downtime deployment on AWS App Runner..."
          aws apprunner start-deployment --service-arn ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          echo "AWS App Runner deployment initiated successfully!"

      - name: Optional Railway Auto-Deploy Trigger
        if: ${{ secrets.RAILWAY_DEPLOY_HOOK != '' }}
        run: |
          echo "Triggering Railway Webhook deployment..."
          curl -s -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
          echo "Railway deployment hook triggered."
